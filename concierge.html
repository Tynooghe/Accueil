<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Concierge</title>

    <link rel="stylesheet" href="./css/style.css?v=2">
</head>
<body>

    <h1>../Central/Dossier/CAS:042/CONCIERGE</h1>

    <img src="./images/logo.png" alt="">

    <a class="close" href="./index.html">
        <img src="./images/cross.png" alt="Retour à l'index">
    </a>

    <div class="lecteur">
        <img class="lecteur-image" src="./images/audio.png" alt="">
        <button class="play" id="play" type="button" aria-label="Écouter l'intro" data-src="./audio/concierge/intro-concierge.mp3">
            <img src="./images/play.png" alt="">
        </button>
    </div>

    <div class="pistes">
        <button type="button" class="piste" data-src="./audio/concierge/reponse-1-concierge.mp3">Où étais-tu hier soir entre 22 h et minuit ?</button>
        <button type="button" class="piste" data-src="./audio/concierge/reponse-2-concierge.mp3">Est-ce que vous avez vu du monde ou entendu du bruit dans le bâtiment hier soir ?</button>
        <button type="button" class="piste" data-src="./audio/concierge/reponse-3-concierge.mp3">Vous avez les clés de toutes les salles du campus… Est-ce que quelqu'un aurait pu vous les emprunter ou forcer une porte ?</button>
    </div>

    <img class="cas-image" src="./images/concierge.png" alt="L'Arrogant">

    <audio id="lecteur-audio"></audio>

    <script>
        const audio = document.getElementById("lecteur-audio");
        const playBtn = document.getElementById("play");
        const pistes = document.querySelectorAll(".piste");

        // Charge un fichier et le lance depuis le début
        function jouer(src) {
            audio.src = src;
            audio.currentTime = 0;
            audio.play();
        }

        // Bouton play : joue uniquement l'intro
        playBtn.addEventListener("click", () => {
            pistes.forEach((p) => p.classList.remove("active"));
            jouer(playBtn.dataset.src);
        });

        // Clic sur une question : joue la réponse correspondante
        pistes.forEach((piste) => {
            piste.addEventListener("click", () => {
                pistes.forEach((p) => p.classList.remove("active"));
                piste.classList.add("active");
                jouer(piste.dataset.src);
            });
        });
    </script>
</body>
</html>
