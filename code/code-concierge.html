<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code - Le Concierge</title>

    <style>
        @font-face {
            font-family: "monster";
            src: url(./font/Monster-AG.ttf);
        }

        html {
            background-color: lightblue;
            min-height: 100dvh;
            font-family: "monster", sans-serif;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;

            box-sizing: border-box;
            width: 92%;
            max-width: 500px;
            margin: 5dvh auto;
            padding: 40px 16px;

            text-align: center;
            color: #1a1a2e;
            background-color: rgba(0, 0, 255, 0.171);
            border: solid 2px;
        }

        h1 {
            margin: 0;
            font-size: 22px;
        }

        .code {
            font-size: 64px;
            letter-spacing: 10px;
            padding-left: 10px; /* compense l'espacement après le dernier chiffre */
        }
    </style>
</head>
<body>
    <h1>Le Concierge</h1>
    <div class="code">0667</div>
</body>
</html>
